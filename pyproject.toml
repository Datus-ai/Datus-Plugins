# Virtual workspace root — not an installable package.
# datus-airflow-plugin and datus-statsig-plugin are published independently.
# The AWS plugins live under datus-aws-plugins/ as one distribution per plugin,
# all depending on the shared datus-aws-common distribution in the same directory.
[tool.uv.workspace]
members = [
    "datus-*-plugin",
    "datus-aws-plugins/datus-aws-common",
    "datus-aws-plugins/datus-*-plugin",
    "datus-gcp-plugins/datus-gcp-common",
    "datus-gcp-plugins/datus-*-plugin",
    "datus-azure-plugins/datus-azure-common",
    "datus-azure-plugins/datus-*-plugin",
    "datus-aliyun-plugins/datus-*-plugin",
]

[dependency-groups]
e2e = [
    "pytest>=8.0",
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
markers = [
    "e2e: deterministic workflow contract and harness tests",
    "llm_e2e: live tests that provision services and call a configured LLM",
    "nightly: heavyweight live workflows",
]
