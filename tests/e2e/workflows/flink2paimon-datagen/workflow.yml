apiVersion: datus.ai/v1alpha1
kind: PluginE2EWorkflow
metadata:
  name: flink2paimon-datagen
  description: Create a Paimon table and write 100 bounded datagen rows through a FlinkDeployment.
  tags: [smoke, flink, paimon, minikube]
spec:
  target:
    distribution: datus-flink-plugin
    path: datus-flink-plugin
    name: flink
  supportPlugins:
    - distribution: datus-k8s-plugin
      path: datus-k8s-plugin
      name: k8s
      profile:
        kubeconfig: "{{KUBECONFIG}}"
        context: "{{KUBE_CONTEXT}}"
        namespace: "{{NAMESPACE}}"
        allowed_namespaces: "{{NAMESPACE}}"
        request_timeout: 60s
        field_manager: datus-e2e
  agent:
    prompt: prompt.md
    timeoutSeconds: 1800
  environment:
    components: [minikube, minio, flink-operator, flink-paimon-runner]
    lock: environment.lock.yml
  workspace:
    outputs:
      - deploy/flink/*/*.sql
      - deploy/flink/*/*.yaml
      - deploy/flink/*/*.yml
      - deploy/flink/*/run-summary.md
  permissions:
    bashAllow:
      - "datus k8s version:*"
      - "datus k8s api-resources:*"
      - "datus k8s auth can-i:*"
      - "datus k8s explain:*"
      - "datus k8s create:*"
      - "datus k8s apply:*"
      - "datus k8s get:*"
      - "datus k8s wait:*"
      - "datus k8s logs:*"
      - "datus k8s events:*"
  oracles:
    - type: files
      config:
        patterns:
          - deploy/flink/*/*.sql
          - deploy/flink/*/*.yaml
          - deploy/flink/*/run-summary.md
        content:
          deploy/flink/*/*.sql:
            - "(?is)CREATE\\s+TABLE.*events.*INSERT\\s+INTO.*events"
            - "'connector'\\s*=\\s*'datagen'"
            - "PRIMARY\\s+KEY\\s*\\(id\\)\\s+NOT\\s+ENFORCED"
          deploy/flink/*/*.yaml:
            - "kind:\\s*FlinkDeployment"
            - "ai\\.datus\\.e2e\\.SqlFileRunner"
    - type: flink_paimon
      config:
        deployment: "flink2paimon-{{RUN_ID}}"
        database: e2e
        table: events
        timeoutSeconds: 900
        schema:
          - {name: id, type: BIGINT, nullable: false}
          - {name: payload, type: STRING, nullable: true}
          - {name: source, type: STRING, nullable: true}
        primaryKey: [id]
        count: 100
        distinctId: 100
        minId: 1
        maxId: 100
        source: [datagen]
  efficiency:
    maxToolCalls: 24
    maxLlmTurns: 12
    maxTokens: 120000
    maxUnexpectedFailures: 0
    forbiddenCommands:
      - "(^|\\s)kubectl(\\s|$)"
      - "sleep\\s+[0-9]"
    expectedCommands:
      - "^datus k8s"
  cleanup:
    deleteNamespace: true
    deleteBucketPrefix: true
