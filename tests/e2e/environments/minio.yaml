apiVersion: v1
kind: Namespace
metadata:
  name: datus-e2e-infra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: datus-e2e-infra
spec:
  replicas: 1
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      containers:
        - name: minio
          image: "{{MINIO_IMAGE}}"
          args: [server, /data, --console-address, ":9001"]
          env:
            - {name: MINIO_ROOT_USER, value: "{{MINIO_ACCESS_KEY}}"}
            - {name: MINIO_ROOT_PASSWORD, value: "{{MINIO_SECRET_KEY}}"}
          ports:
            - {name: api, containerPort: 9000}
            - {name: console, containerPort: 9001}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: api}
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: datus-e2e-infra
spec:
  selector: {app: minio}
  ports:
    - {name: api, port: 9000, targetPort: api}
    - {name: console, port: 9001, targetPort: console}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-warehouse
  namespace: datus-e2e-infra
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mc
          image: "{{MC_IMAGE}}"
          command: [/bin/sh, -ec]
          args:
            - >-
              mc alias set local http://minio:9000 {{MINIO_ACCESS_KEY}} {{MINIO_SECRET_KEY}};
              mc mb --ignore-existing local/warehouse
