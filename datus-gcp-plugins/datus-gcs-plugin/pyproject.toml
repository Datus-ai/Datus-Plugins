[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datus-gcs-plugin"
version = "0.1.0"
description = "Datus plugin: browse and move Google Cloud Storage data"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Datus" }]
dependencies = ["datus-gcp-common>=0.1", "google-cloud-storage>=2.18"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jinja2>=3.1", "jsonschema>=4.0"]

[project.entry-points."datus.plugins"]
gcs = "datus_gcs_plugin"

[tool.hatch.build.targets.wheel]
packages = ["datus_gcs_plugin"]

[tool.uv.sources]
datus-gcp-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
