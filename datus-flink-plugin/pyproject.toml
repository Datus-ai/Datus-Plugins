[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datus-flink-plugin"
version = "0.1.1"
description = "Datus skill-only plugin for building and operating Flink jobs on Kubernetes Operator"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Datus" }]
keywords = ["datus", "flink", "kubernetes", "operator", "plugin", "skill"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "PyYAML>=6.0"]

[project.entry-points."datus.plugins"]
flink = "datus_flink_plugin"

[tool.hatch.build.targets.wheel]
packages = ["datus_flink_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
