apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: datus-flink-session-smoke
  namespace: datus-flink-operator-test
spec:
  image: flink:2.2
  imagePullPolicy: IfNotPresent
  flinkVersion: v2_2
  serviceAccount: flink
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
  jobManager:
    resource:
      memory: 1024m
      cpu: 0.5
  taskManager:
    resource:
      memory: 1024m
      cpu: 0.5
