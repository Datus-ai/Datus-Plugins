[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datus-aks-plugin"
version = "0.1.0"
description = "Datus plugin: inspect AKS and authenticate datus-k8s without az or kubelogin"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Datus" }]
dependencies = ["datus-azure-common>=0.1", "azure-mgmt-containerservice>=34.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jinja2>=3.1", "jsonschema>=4.0"]

[project.entry-points."datus.plugins"]
aks = "datus_aks_plugin"

[tool.hatch.build.targets.wheel]
packages = ["datus_aks_plugin"]

[tool.uv.sources]
datus-azure-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
