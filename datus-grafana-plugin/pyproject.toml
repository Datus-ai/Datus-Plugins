[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datus-grafana-plugin"
version = "0.1.0"
description = "Datus plugin for Grafana dashboards, panels, datasources, queries, alerting, and project query export"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Datus" }]
keywords = ["datus", "grafana", "bi", "observability", "plugin"]
dependencies = ["httpx>=0.27", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jinja2>=3.1", "jsonschema>=4.0", "build>=1.2"]

[project.entry-points."datus.plugins"]
grafana = "datus_grafana_plugin"

[tool.hatch.build.targets.wheel]
packages = ["datus_grafana_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
