[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datus-ack-plugin"
version = "0.2.0"
description = "Datus plugin: inspect Alibaba Cloud ACK and authenticate datus-k8s"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Datus" }]
dependencies = [
    "alibabacloud-cs20151215>=4.7",
    "alibabacloud-credentials>=1.0",
    "alibabacloud-tea-openapi>=0.3",
    "alibabacloud-tea-util>=0.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jinja2>=3.1", "jsonschema>=4.0"]

[project.entry-points."datus.plugins"]
ack = "datus_ack_plugin"

[tool.hatch.build.targets.wheel]
packages = ["datus_ack_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
