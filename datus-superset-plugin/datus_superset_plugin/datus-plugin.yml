    allow: *superset_allow
    ask: *superset_ask

config_schema:
  type: object
  required: [api_base_url, auth_mode]
  additionalProperties: false
  properties:
    api_base_url: {type: string, description: "Superset origin, for example https://superset.example.com"}
    auth_mode: {type: string, enum: [login, token], default: login, description: "login or token"}
    username: {type: string, description: "Superset username for login auth"}
    password: {type: string, x-secret: true, description: "Superset password via an environment variable"}
    access_token: {type: string, x-secret: true, description: "Bearer access token via an environment variable"}
    provider: {type: string, default: db, description: "Superset security provider"}
    verify_ssl: {type: string, enum: ["true", "false"], default: "true", description: "Verify TLS certificates"}
    timeout: {type: string, default: "30", description: "HTTP timeout in seconds"}
    serving_datasource: {type: string, description: "Optional Datus datasource name served by Superset"}
    serving_database_name: {type: string, description: "Optional warehouse database name"}

commands:
  - {name: status, description: "Health, identity, roles, and OpenAPI", subcommands: [{name: health}, {name: whoami}, {name: roles}, {name: openapi}]}
  - {name: dashboards, description: "Dashboard CRUD, embedding, import/export, state, and images", subcommands: [{name: list}, {name: get}, {name: charts}, {name: datasets}, {name: tabs}, {name: create}, {name: copy}, {name: update}, {name: delete}, {name: bulk-delete}, {name: export}, {name: import}, {name: favorite-status}, {name: favorite-add}, {name: favorite-remove}, {name: embedded-get}, {name: embedded-set}, {name: embedded-update}, {name: embedded-delete}, {name: filters-update}, {name: colors-update}, {name: chart-customizations-update}, {name: thumbnail}, {name: screenshot}, {name: cache-screenshot}, {name: permalink-create}, {name: permalink-get}, {name: filter-state-create}, {name: filter-state-get}, {name: filter-state-delete}]}
  - {name: charts, description: "Chart CRUD, data queries, cache, dashboard attachment, and import/export", subcommands: [{name: list}, {name: get}, {name: create}, {name: update}, {name: delete}, {name: bulk-delete}, {name: data}, {name: query}, {name: query-cache}, {name: export}, {name: import}, {name: warm-cache}, {name: favorite-status}, {name: favorite-add}, {name: favorite-remove}, {name: thumbnail}, {name: screenshot}, {name: cache-screenshot}, {name: add-to-dashboard}]}
  - {name: datasets, description: "Dataset CRUD, metadata, metrics, columns, cache, and import/export", subcommands: [{name: list}, {name: get}, {name: related}, {name: drill-info}, {name: distinct}, {name: create}, {name: get-or-create}, {name: duplicate}, {name: update}, {name: delete}, {name: bulk-delete}, {name: refresh}, {name: column-delete}, {name: metric-delete}, {name: warm-cache}, {name: export}, {name: import}]}
  - {name: databases, description: "Database connections, catalog metadata, validation, upload, and import/export", subcommands: [{name: list}, {name: get}, {name: available}, {name: connection}, {name: catalogs}, {name: schemas}, {name: tables}, {name: table}, {name: table-metadata}, {name: table-extra}, {name: select-star}, {name: functions}, {name: related}, {name: create}, {name: update}, {name: delete}, {name: test}, {name: validate-parameters}, {name: validate-sql}, {name: sync-permissions}, {name: export}, {name: import}, {name: upload-metadata}, {name: upload}]}
  - {name: sql-lab, description: "Execute, estimate, format, fetch, and export SQL Lab queries", subcommands: [{name: execute}, {name: estimate}, {name: results}, {name: export}, {name: export-stream}, {name: format}, {name: permalink-create}, {name: permalink-get}]}
  - {name: queries, description: "Query history and cancellation", subcommands: [{name: list}, {name: get}, {name: updated-since}, {name: stop}, {name: distinct}]}
  - {name: saved-queries, description: "Saved query CRUD and migration", subcommands: [{name: list}, {name: get}, {name: create}, {name: update}, {name: delete}, {name: bulk-delete}, {name: export}, {name: import}]}
  - {name: explore, description: "Explore form data and permalinks", subcommands: [{name: get}, {name: form-data-create}, {name: form-data-get}, {name: form-data-delete}, {name: permalink-create}, {name: permalink-get}]}
  - {name: datasources, description: "Datasource values and expression validation", subcommands: [{name: column-values}, {name: validate-expression}]}
  - {name: advanced-types, description: "Advanced data-type discovery and conversion", subcommands: [{name: list}, {name: convert}]}
  - {name: tags, description: "Tag discovery and attachment", subcommands: [{name: list}, {name: get}, {name: bulk-create}, {name: objects}, {name: attach}, {name: detach}, {name: favorite-status}]}
  - {name: reports, description: "Scheduled report CRUD and logs", subcommands: [{name: list}, {name: get}, {name: create}, {name: update}, {name: delete}, {name: logs}, {name: log-get}, {name: slack-channels}]}
  - {name: annotations, description: "Annotation layer and annotation CRUD", subcommands: [{name: layers-list}, {name: layers-get}, {name: layers-create}, {name: layers-update}, {name: layers-delete}, {name: list}, {name: get}, {name: create}, {name: update}, {name: delete}]}
  - {name: rls, description: "Row-level security CRUD", subcommands: [{name: list}, {name: get}, {name: create}, {name: update}, {name: delete}, {name: bulk-delete}]}
  - {name: assets, description: "Bulk asset import and export", subcommands: [{name: export}, {name: import}]}
  - {name: cache, description: "Cache invalidation", subcommands: [{name: invalidate}]}
  - {name: audit, description: "Audit log and recent activity", subcommands: [{name: list}, {name: get}, {name: recent}]}
  - {name: serving-target, description: "Show the configured serving datasource"}
  - name: context
    description: "Build project context from dashboard SQL"
    subcommands:
      - name: export-dashboard
        args: [{name: dashboard_id, required: true}, {name: --output-root}, {name: --include-hidden}, {name: --overwrite}]
  - name: api
    description: "Guarded access to additional official API endpoints"
    subcommands:
      - {name: call, args: [{name: method, required: true}, {name: path, required: true}, {name: --json-file}, {name: --output-file}]}
