apiVersion: v1
kind: ConfigMap
metadata:
  name: datus-k8s-smoke
data:
  purpose: minikube-integration-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datus-k8s-smoke
  labels:
    app: datus-k8s-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datus-k8s-smoke
  template:
    metadata:
      labels:
        app: datus-k8s-smoke
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10.1
