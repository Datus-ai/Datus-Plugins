[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datus-k8s-plugin"
version = "0.1.0"
description = "Datus plugin: inspect and operate namespace-scoped Kubernetes data workloads with a kubectl-style CLI"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Datus" }]
keywords = ["datus", "kubernetes", "k8s", "kubectl", "plugin", "cli"]
dependencies = [
    "kubernetes>=35.0,<36.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jinja2>=3.1", "jsonschema>=4.0"]

[project.entry-points."datus.plugins"]
k8s = "datus_k8s_plugin"

[tool.hatch.build.targets.wheel]
packages = ["datus_k8s_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
